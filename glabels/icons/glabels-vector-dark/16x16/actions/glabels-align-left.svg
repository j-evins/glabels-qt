<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="16" height="16" >

  <style type="text/css" id="current-color-scheme" >
    .ColorScheme-Text { color:#f0f0f0; }
  </style>

  <rect
      class="ColorScheme-Text"
      style="fill:none;stroke:currentColor;stroke-opacity:1;stroke-width:1"
      x="3.5" y="1.5" width="7" height="3" />
  
  <rect
      class="ColorScheme-Text"
      style="fill:none;stroke:currentColor;stroke-opacity:1;stroke-width:1"
      x="3.5" y="6.5" width="11" height="3" />
  
  <rect
      class="ColorScheme-Text"
      style="fill:none;stroke:currentColor;stroke-opacity:1;stroke-width:1"
      x="3.5" y="11.5" width="5" height="3" />
  
  <line
      class="ColorScheme-Text"
      style="fill:none;stroke:currentColor;stroke-opacity:1;stroke-width:1"
      x1="1.5" y1="1" x2="1.5" y2="15" />

</svg>
